name: Capture visual baselines

# Visual parity baselines must be captured on the same runner image that CI compares on.
# Trigger: push a change to .github/visual-baselines.request on any branch.
on:
  push:
    paths:
      - .github/visual-baselines.request

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Capture baselines (QT-109/110 capture path)
        run: UPDATE_VISUAL_BASELINES=1 npx playwright test tests/qualification/visual.spec.js -g "QT-109|QT-110"
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/qualification/__baseline__
          git diff --cached --quiet && exit 0
          git commit -m "test: capture visual baselines on CI runner"
          git push origin HEAD:${GITHUB_REF_NAME}
