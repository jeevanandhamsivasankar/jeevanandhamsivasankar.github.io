<style>
  :root {
    --kumkum: #8E1426;
    --maroon: #5E0B17;
    --maroon-deep: #3E0710;
    --gold: #E8B54C;
    --marigold: #F2A007;
    --rose: #B0402A;
    --peacock-blue: #0E5C6B;
    --jasmine: #FFFDF8;
    --ink: #2B1518;
    --muted: #6B4C4F;
    --line: #EBD8C6;
    --tint-rose: #FBEEE6;
    --tint-gold: #FFF4DA;
    --display: "Rozha One", Georgia, "Times New Roman", serif;
    --body: "Mukta", "Mukta Malar", system-ui, -apple-system, "Segoe UI", sans-serif;
    --tamil: "Mukta Malar", "Mukta", "Noto Sans Tamil", "Tamil Sangam MN", sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--jasmine);
    color: var(--ink);
    font: 400 1.125rem/1.65 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  body.locked { overflow: hidden; }
  h1, h2, h3 { font-family: var(--display); font-weight: 400; margin: 0; line-height: 1.1; }
  p { margin: 0; }
  a { color: inherit; }
  img { max-width: 100%; display: block; }
  :focus-visible { outline: 3px solid var(--marigold); outline-offset: 3px; border-radius: 6px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  /* ---------- Marigold garland ---------- */
  .rope {
    height: 22px;
    background:
      radial-gradient(circle at 22px 4px, #FFF6E0 0 2.4px, transparent 3px) 0 0 / 44px 22px repeat-x,
      radial-gradient(circle at 11px 11px, #EC7C10 0 8px, #D8620B 8.2px 9.4px, transparent 9.8px) 0 0 / 44px 22px repeat-x,
      radial-gradient(circle at 33px 11px, #F6B516 0 8px, #E9A10A 8.2px 9.4px, transparent 9.8px) 0 0 / 44px 22px repeat-x;
  }
  .garland { position: absolute; inset: 0 0 auto 0; pointer-events: none; z-index: 1; }
  .strands {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 0 4px; margin-top: -8px;
  }
  .strand { display: block; flex: none; transform-origin: 50% 0; }
  body:not(.is-open) .strand { transform: translateY(-110%); }
  .is-open .strand { animation: drop 1.7s cubic-bezier(.22, 1, .36, 1) calc(var(--i) * 55ms) both; }
  .is-open.settled .strand { animation: none; transform: none; }
  @keyframes drop {
    0%   { transform: translateY(-110%) rotate(0deg); }
    42%  { transform: translateY(0) rotate(0deg); }
    60%  { transform: translateY(0) rotate(calc(4deg * var(--dir))); }
    76%  { transform: translateY(0) rotate(calc(-2deg * var(--dir))); }
    89%  { transform: translateY(0) rotate(calc(.8deg * var(--dir))); }
    100% { transform: translateY(0) rotate(0deg); }
  }

  /* ---------- Hero ---------- */
  .hero {
    position: relative; overflow: hidden; isolation: isolate;
    min-height: 100vh; min-height: 100svh;
    display: grid; grid-template-columns: minmax(0, 1fr); place-items: center; text-align: center;
    padding: clamp(170px, 26vh, 240px) 1.25rem 4.5rem;
    color: var(--jasmine);
    background:
      radial-gradient(60% 40% at 50% 30%, rgba(255, 196, 92, .16), transparent 70%),
      radial-gradient(130% 85% at 50% 40%, #A51D30 0%, #7E1121 45%, var(--maroon-deep) 100%);
  }
  .hero.has-couple { padding-bottom: 0; align-content: end; }
  .hero-inner { position: relative; z-index: 3; width: 100%; max-width: 64rem; }
  .vel-mark { display: block; width: 30px; height: 92px; margin: 0 auto .7rem; filter: drop-shadow(0 2px 6px rgba(0,0,0,.35)); }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: clamp(110px, 15vw, 170px); z-index: 1; pointer-events: none; }
  .feather { position: absolute; bottom: -14px; width: clamp(78px, 20vw, 140px); aspect-ratio: 60 / 170; height: auto; z-index: 2; pointer-events: none; }
  .feather.l { left: -10px; transform: rotate(-16deg); transform-origin: bottom center; }
  .feather.r { right: -10px; transform: scaleX(-1) rotate(-16deg); transform-origin: bottom center; }
  .hero-couple { position: relative; margin: 2rem auto 0; width: min(320px, 78vw); }
  .hero-couple::before {
    content: ""; position: absolute; z-index: -1; left: 50%; top: -22%;
    width: 150%; aspect-ratio: 1; transform: translateX(-50%);
    background:
      radial-gradient(closest-side, rgba(255, 205, 110, .55), rgba(255, 170, 60, .18) 55%, transparent 72%),
      repeating-conic-gradient(from 0deg, rgba(255, 210, 120, .14) 0 4deg, transparent 4deg 12deg);
    -webkit-mask: radial-gradient(closest-side, #000 55%, transparent 100%);
            mask: radial-gradient(closest-side, #000 55%, transparent 100%);
    border-radius: 50%;
  }
  .hero-couple img { width: 100%; height: auto; filter: drop-shadow(0 10px 24px rgba(30, 0, 6, .45)); }
  @media (min-width: 900px) {
    .hero.has-couple { padding-top: 200px; }
    .hero.has-couple .hero-inner { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); align-items: end; gap: 2.5rem; }
    .hero.has-couple .hero-text { align-self: center; padding-bottom: 5rem; }
    .hero.has-couple .hero-couple { margin: 0; width: auto; justify-self: center; }
    .hero.has-couple .hero-couple img { width: auto; height: min(74vh, 700px); max-width: 100%; }
  }
  .hero-intro { font-size: 1.1rem; opacity: .86; margin-bottom: 1.1rem; }
  .names {
    display: flex; flex-direction: column; align-items: center;
    font-size: clamp(3.6rem, 17vw, 8rem); line-height: .92;

  .names > span { white-space: nowrap; }
  .names .amp { color: var(--gold); font-size: .78em; line-height: 1; margin: .08em 0 .04em; }
  .hero-date { margin-top: 1.9rem; font-weight: 500; font-size: 1.2rem; line-height: 1.45; }
  .hero-date .time { color: var(--gold); }
  .hero-date .city { font-weight: 400; opacity: .86; }
  .countdown {
    display: inline-block; margin-top: 1.6rem; padding: .3rem 1.1rem;
    border: 1.5px solid rgba(232, 181, 76, .7); border-radius: 999px;

  /* ---------- Sections ---------- */
  .section { padding: clamp(3.75rem, 10vw, 6.5rem) 1.25rem; }
  .wrap { max-width: 38rem; margin: 0 auto; }
  .wrap.wide { max-width: 60rem; }
  .section h2 {
    font-size: clamp(2.3rem, 9vw, 3.3rem); color: var(--kumkum);

  .lead { text-align: center; color: var(--muted); margin: -.5rem auto 2rem; max-width: 32ch; }

  /* Invitation */
  .invite { text-align: center; }
  .message { font-size: 1.3rem; line-height: 1.6; max-width: 34ch; margin: 0 auto 3.25rem; text-wrap: balance; }
  .partners { display: grid; gap: 2.5rem; }
  .partner .role { color: var(--rose); font-weight: 600; margin-bottom: .2rem; }
  .partner h3 { font-size: clamp(1.9rem, 7vw, 2.3rem); color: var(--kumkum); }
  .partner .qual { margin-top: .3rem; font-weight: 600; color: var(--ink); }
  .partner .place { color: var(--muted); font-size: 1rem; }
  .partner .parents { margin-top: .55rem; color: var(--muted); max-width: 30ch; margin-inline: auto; text-wrap: balance; }
  .partners .knot { width: 22px; height: 68px; margin: 0 auto; }
  @media (min-width: 700px) {
    .invite .wrap { max-width: 54rem; }
    .partners { grid-template-columns: 1fr auto 1fr; align-items: center; gap: 2.5rem; }
  }

  /* Tamil invitation + relatives */
  .tamil { font-family: var(--tamil); text-align: center; border-top: 1px solid var(--line); }
  .tamil h2 { font-family: var(--tamil); font-weight: 700; font-size: clamp(1.9rem, 7.5vw, 2.6rem); line-height: 1.3; }
  .tamil .ta-text { font-size: 1.15rem; line-height: 1.95; max-width: 34ch; margin: 0 auto; text-wrap: pretty; }
  .tamil .ta-sign { margin-top: 1.75rem; line-height: 1.8; }
  .tamil .ta-sign strong { color: var(--kumkum); font-weight: 700; }
  .relatives { margin-top: 3.25rem; padding-top: 2.75rem; border-top: 1px solid var(--line); }
  .relatives h3 { font-family: var(--tamil); font-weight: 700; font-size: 1.45rem; color: var(--rose); line-height: 1.4; margin-bottom: 1.75rem; }
  .rel-group + .rel-group { margin-top: 1.6rem; }
  .rel-group h4 { margin: 0 0 .35rem; font-weight: 700; font-size: 1.05rem; color: var(--kumkum); }
  .rel-group ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
  .rel-group li { line-height: 1.6; }

  /* Story */
  .story .wrap p + p { margin-top: 1rem; }

  /* Events timeline */
  .timeline { list-style: none; margin: 2.25rem 0 0; padding: 0; }
  .event {
    position: relative;
    display: grid; grid-template-columns: 4.5rem 1fr; gap: 1.25rem;
    padding-bottom: 3rem;
  }
  .event:last-child { padding-bottom: 0; }
  .event::before {
    content: ""; position: absolute;
    left: calc(2.25rem - 5px); top: 5.9rem; bottom: .75rem; width: 10px;
    background: radial-gradient(circle, var(--marigold) 0 3.4px, transparent 4px) 0 0 / 10px 13px repeat-y;
  }
  .event:last-child::before { display: none; }
  .event-date {
    width: 4.5rem; height: 5.4rem;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    border-radius: 2.25rem 2.25rem .6rem .6rem;
    background: var(--kumkum); color: var(--jasmine);
    line-height: 1; padding-top: .35rem;
  }
  .event-date .wd { font-size: .85rem; opacity: .85; }
  .event-date .dd { font-family: var(--display); font-size: 2rem; color: var(--gold); margin: .15rem 0 .05rem; }
  .event-date .mm { font-size: .9rem; font-weight: 600; }
  .event-body h3 { font-size: clamp(1.7rem, 6.5vw, 2rem); color: var(--kumkum); }
  .event-time { margin: .2rem 0 .8rem; font-weight: 600; color: var(--rose); }
  .event-venue strong { font-weight: 600; }
  .event-venue span, .event-note { color: var(--muted); }
  .event-note { margin-top: .5rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.1rem; }
  .cal { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 1.1rem; margin-top: .75rem; font-size: 1rem; color: var(--muted); }
  @media (max-width: 480px) { .cal > span { flex-basis: 100%; } }
  .cal a, .cal button {
    display: inline-block; padding: .35rem 0;
    font: 600 1rem/1.4 var(--body); color: var(--kumkum);
    background: none; border: 0; cursor: pointer;
    text-decoration: underline; text-decoration-color: var(--marigold);
    text-decoration-thickness: 2px; text-underline-offset: 4px;
  }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .45rem;
    min-height: 44px; padding: .5rem 1.15rem;
    border: 1.5px solid var(--kumkum); border-radius: 999px;
    background: var(--kumkum); color: var(--jasmine);
    font: 600 1rem/1.2 var(--body); text-decoration: none; cursor: pointer;
    transition: background-color .15s, color .15s;
  }
  .btn:hover { background: var(--maroon); }
  .btn-ghost { background: transparent; color: var(--kumkum); }
  .btn-ghost:hover { background: var(--tint-rose); }
  .btn-gold { background: var(--gold); border-color: var(--gold); color: #3A1A00; }
  .btn-gold:hover { background: #F5C766; }
  .btn-small { font-size: .95rem; padding: .45rem .95rem; }
  .btn-large { min-height: 52px; padding: .7rem 1.8rem; font-size: 1.1rem; }

  /* Venue */
  .venue { background: var(--tint-rose); text-align: center; }
  .venue-name { font-family: var(--display); font-size: 1.6rem; color: var(--kumkum); }
  .venue-addr { color: var(--muted); margin-top: .25rem; }
  .map {
    display: block; width: 100%; aspect-ratio: 4 / 3; border: 0;
    border-radius: 18px; margin: 1.75rem 0 1.5rem; background: #D9E7E4;
  }
  .venue-notes { margin-top: 1.25rem; color: var(--muted); }

  /* Gallery */
  .grid { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); margin-top: 2rem; }
  .grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 14px; }

  /* RSVP */
  .rsvp { background: var(--tint-gold); }
  .rsvp-form {
    display: grid; gap: 1.4rem;
    background: #fff; border: 1px solid var(--line); border-radius: 22px;
    padding: clamp(1.25rem, 5vw, 2rem);
  }
  .field { display: grid; gap: .4rem; }
  label, legend { font-weight: 600; }
  legend { padding: 0; margin-bottom: .35rem; }
  fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
  input[type="text"], select, textarea {
    width: 100%; font: inherit; color: var(--ink);

  textarea { resize: vertical; }
  input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--kumkum); }
  .choice { display: flex; align-items: center; gap: .65rem; font-weight: 400; padding: .3rem 0; cursor: pointer; }
  .choice input { width: 1.25rem; height: 1.25rem; margin: 0; accent-color: var(--kumkum); flex: none; }
  .if-yes { display: grid; gap: 1.4rem; }
  .if-yes[hidden] { display: none; }
  .opt { font-weight: 400; color: var(--muted); }
  .form-error { color: var(--rose); font-weight: 600; }
  .form-error:empty { display: none; }
  .hint { font-size: .95rem; color: var(--muted); margin-top: -.6rem; }

  /* Footer */
  .footer {
    background: var(--maroon-deep); color: var(--jasmine);
    text-align: center; padding: 0 1.25rem calc(3.5rem + env(safe-area-inset-bottom));

  .footer > .rope { margin: 0 -1.25rem 3rem; }
  .footer .vel-mark { width: 24px; height: 74px; margin-bottom: 1.25rem; }
  .footer-names { font-family: var(--display); font-size: clamp(2rem, 9vw, 3rem); line-height: 1.1; }

  .hashtag { font-family: var(--display); font-size: clamp(1.9rem, 8vw, 2.7rem); color: var(--marigold); line-height: 1.15; overflow-wrap: anywhere; }
  .closing { margin: .8rem auto 2.25rem; opacity: .9; max-width: 30ch; }
  .contacts { margin-bottom: 2.25rem; }
  .contacts ul { list-style: none; padding: 0; margin: .4rem 0 0; display: grid; gap: .35rem; }
  .contacts a { color: var(--jasmine); text-underline-offset: 3px; font-weight: 600; }

  /* Cover */
  .cover {
    position: fixed; inset: 0; z-index: 50;
    display: flex; flex-direction: column; justify-content: space-between;
    background:
      radial-gradient(55% 35% at 50% 42%, rgba(255, 196, 92, .18), transparent 70%),
      radial-gradient(130% 85% at 50% 45%, #A51D30 0%, #7E1121 48%, var(--maroon-deep) 100%);

  .cover { overflow-y: auto; }
  .cover > .rope { flex: none; }
  .cover-inner { margin: auto; padding: 2rem 1.5rem; max-width: 30rem; }
  .cover .vel-mark { width: 26px; height: 80px; margin-bottom: 1.2rem; }
  .deity { margin: 0 auto 1.4rem; width: fit-content; position: relative; }
  .deity::before {
    content: ""; position: absolute; inset: -18% -30%; z-index: -1;
    background: radial-gradient(closest-side, rgba(255, 200, 100, .35), transparent 75%);
  }
  .deity img {
    display: block; height: min(36vh, 380px); width: auto; aspect-ratio: 540 / 892;
    border-radius: 999px 999px 14px 14px; border: 2px solid var(--gold);

  .cover-inner { position: relative; z-index: 0; }
  .cover-greet { font-family: var(--display); font-size: clamp(1.6rem, 7vw, 2.1rem); color: var(--gold); line-height: 1.2; }
  .cover-line { margin-top: .4rem; font-size: 1.15rem; opacity: .9; }
  .cover-names { font-family: var(--display); font-size: clamp(2.8rem, 13vw, 4.4rem); line-height: 1.05; margin: .9rem 0 .6rem; }
  .cover-names span { color: var(--gold); }
  .cover-date { font-weight: 500; margin-bottom: 2.25rem; }

  /* Music */
  .music {
    position: fixed; right: 1rem; bottom: calc(1rem + env(safe-area-inset-bottom)); z-index: 40;
    width: 52px; height: 52px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--marigold); color: #2B1B00;
    display: grid; place-items: center;
    box-shadow: 0 6px 18px rgba(10, 56, 54, .35);
  }
  .music svg { width: 24px; height: 24px; }
  .music[aria-pressed="false"] .on, .music[aria-pressed="true"] .off { display: none; }

  noscript p { padding: 2rem; text-align: center; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after { animation: none !important; transition: none !important; }
    body .strand { transform: none !important; }
  }
</style>

<script>

  // Add, remove or reorder events. An event without its own venue uses the main venue.

  ],

  // Tamil invitation from the printed card (shown in its own section)
  tamil: {
    heading: "திருமண அழைப்பிதழ்",
    text: "மணமக்கள் S. டெல்லிகணேஷ், B.A., Army., M. பவித்ரா, M.Sc., ஆகிய இவர்களுக்கு 13.11.2026, வெள்ளிக்கிழமை காலை 6.00 மணிக்குமேல் 7.30 மணிக்குள்ளாக நடைபெறும் திருமணத்திற்கு நானே நேரில் வந்து அழைத்ததாக கருதி தாங்கள் தங்கள் சுற்றமும் நட்பும் சூழ வருகைதந்து மணமக்களை வாழ்த்துமாறு அன்புடன் அழைக்கின்றேன்.",
    signatureLabel: "தங்கள் அன்புள்ள",
    signature: "திரு. V. சிவசங்கரன் திருமதி. S. சத்யா",
    signaturePlace: "அவரைக்கரை கிராமம்"
  },

  // Relatives list from the printed card. Use [] to hide it.
  relativesHeading: "தங்கள் வரவை அன்புடன் எதிர்நோக்கும்",
  relatives: [
    { label: "அத்தை மாமா", people: [

    ] },
    { label: "தாய்மாமன்கள்", people: [
      "திரு. N. செந்தில்குமார், Ex. Army. திருமதி. தனம், நெல்வாய்.",
      "திரு. N. சதீஷ்குமார், Ex. Army. திருமதி. சோனியா, நெல்வாய்.",
      "திரு. J. கார்த்திக், திருமதி. ஐஸ்வர்யா, சென்னை."
    ] },
    { label: "மருமகப்பிள்ளை", people: [
      "திரு. D. ஸ்ரீதர், DME., (PATC நடத்துனர்) திருமதி. ரேணுகா, M.Com., M.Phil., மேட்டுகுடிசை."
    ] },
    { label: "அண்ணன் அண்ணிகள்", people: [
      "திரு. G. கிருபானந்தன், B.Sc., Army. திருமதி. சுகன்யா, B.Ed., அவரைக்கரை.",
      "திரு. G. தரணி, DME., திருமதி. ஹேமலதா, அவரைக்கரை.",
      "திரு. D. வசந்தகுமார், B.E., திருமதி. கிரிஜா, M.Sc., B.Ed., Ph.D., அவரைக்கரை.",
      "திரு. D. பாலாஜி, B.E., திருமதி. ஜெகதீஷ்வரி, B.A., B.Ed., அவரைக்கரை.",
      "திரு. S. ஜீவானந்தம், M.E., அவரைக்கரை."
    ] }
  ],

  rsvp: {
    // WhatsApp number that receives replies, with country code, digits only: "919xxxxxxxxx"
    // Leave both whatsapp and formUrl empty to hide the RSVP section.
    whatsapp: "",
    // Or a Google Form link (used only if whatsapp is empty)
    formUrl: "",
    deadline: "",             // "YYYY-MM-DD", or "" to hide
    maxGuests: 10
  },

  // People guests can call. Example:
  // contacts: [ { name: "V. Siva Sankaran", phone: "+91 9xxxx xxxxx" } ],
  contacts: [],

  hashtag: "",                  // e.g. "#GaneshWedsPavithra"
  closing: "With best compliments from relatives & friends",

  // Optional extras: upload the files to your repository, then put their names here
  couplePhoto: "couple.webp",   // transparent photo, shown on the first screen
  photos: [],                   // e.g. ["photo1.jpg", "photo2.jpg"]
  story: [],                    // e.g. ["First paragraph...", "Second paragraph..."]
  music: "",                    // e.g. "nadaswaram.mp3" (plays after the guest opens the invitation)

  deityPhoto: "murugan.webp",   // Lord Murugan, shown on the opening screen
  showCover: true               // the "Open invitation" screen

<script>
(function () {
  "use strict";
  const W = WEDDING;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  /* ---------- Dates ---------- */
  const tz = W.timezone || "Asia/Kolkata";
  const dtf = (opts, loc) => new Intl.DateTimeFormat(loc || "en-IN", Object.assign({ timeZone: tz }, opts));
  const longDate = (d) => dtf({ weekday: "long", day: "numeric", month: "long", year: "numeric" }).format(d);
  const clock = (d) => dtf({ hour: "numeric", minute: "2-digit", hour12: true }).format(d)
    .replace(/[\s\u202f]+/g, " ").replace(/(am|pm)/i, (m) => m.toLowerCase());
  const dayKey = (d) => dtf({ year: "numeric", month: "2-digit", day: "2-digit" }, "en-CA").format(d);
  const events = (W.events || []).filter((e) => e && e.start);
  const startOf = (e) => new Date(e.start);
  const endOf = (e) => (e.end ? new Date(e.end) : new Date(startOf(e).getTime() + 3 * 3600e3));
  const main = new Date(W.mainDate || (events[0] && events[0].start));
  const A = W.couple.first, B = W.couple.second;
  const pair = A.name + " & " + B.name;
  const pageUrl = () => location.href.split(/[?#]/)[0];

  const params = new URLSearchParams(location.search);
  const guest = (params.get("to") || "").trim().slice(0, 60);

  function countdown() {
    const today = Date.parse(dayKey(new Date()) + "T00:00:00Z");
    const day = Date.parse(dayKey(main) + "T00:00:00Z");
    const diff = Math.round((day - today) / 864e5);
    if (diff > 1) return diff + " days to go";
    if (diff === 1) return "Tomorrow";
    if (diff === 0) return "Today's the day";
    return "Thank you for celebrating with us";
  }

  /* ---------- Maps & calendars ---------- */
  const venueOf = (e) => (e.venue && e.venue.name ? e.venue : W.venue || {});
  const place = (v) => [v.name, v.address].filter(Boolean).join(", ");
  const mapsLink = (v) => v.mapLink || "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(place(v));
  const mapEmbed = (v) => "https://maps.google.com/maps?q=" + encodeURIComponent(v.mapQuery || place(v)) + "&z=" + (v.mapQuery ? 13 : 15) + "&output=embed";
  const utc = (d) => d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const calTitle = (e) => e.name + ": " + pair;
  const calDetails = (e) => [e.note, "Invitation: " + pageUrl()].filter(Boolean).join("\n");

  function gcalLink(e) {
    return "https://calendar.google.com/calendar/render?action=TEMPLATE" +
      "&text=" + encodeURIComponent(calTitle(e)) +
      "&dates=" + utc(startOf(e)) + "/" + utc(endOf(e)) +
      "&details=" + encodeURIComponent(calDetails(e)) +
      "&location=" + encodeURIComponent(place(venueOf(e)));
  }

  function icsFile(e, i) {
    const t = (s) => String(s).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
    const fold = (line) => { const out = []; while (line.length > 73) { out.push(line.slice(0, 73)); line = " " + line.slice(73); } out.push(line); return out.join("\r\n"); };
    return [
      "BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Wedding invitation//EN", "CALSCALE:GREGORIAN", "METHOD:PUBLISH",
      "BEGIN:VEVENT",
      "UID:" + utc(startOf(e)) + "-" + i + "@wedding-invitation",
      "DTSTAMP:" + utc(new Date()),
      "DTSTART:" + utc(startOf(e)),
      "DTEND:" + utc(endOf(e)),
      "SUMMARY:" + t(calTitle(e)),
      "LOCATION:" + t(place(venueOf(e))),
      "DESCRIPTION:" + t(calDetails(e)),
      "END:VEVENT", "END:VCALENDAR"
    ].map(fold).join("\r\n");
  }

  function downloadIcs(i) {
    const e = events[i];
    const blob = new Blob([icsFile(e, i)], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = (e.name || "event").toLowerCase().replace(/[^a-z0-9]+/g, "-") + ".ics";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
  }

  /* ---------- Garland ---------- */
  function flower(id, outer, mid, inner, centre) {
    let s = '<symbol id="' + id + '" viewBox="0 0 24 24">';
    for (let a = 0; a < 10; a++) {
      const r = (a / 10) * Math.PI * 2;
      s += '<circle cx="' + (12 + 7.2 * Math.cos(r)).toFixed(2) + '" cy="' + (12 + 7.2 * Math.sin(r)).toFixed(2) + '" r="3.9" fill="' + outer + '"/>';
    }
    s += '<circle cx="12" cy="12" r="7.4" fill="' + mid + '"/>';
    for (let a = 0; a < 7; a++) {
      const r = (a / 7) * Math.PI * 2 + 0.3;
      s += '<circle cx="' + (12 + 3.9 * Math.cos(r)).toFixed(2) + '" cy="' + (12 + 3.9 * Math.sin(r)).toFixed(2) + '" r="2.6" fill="' + inner + '"/>';
    }
    return s + '<circle cx="12" cy="12" r="1.7" fill="' + centre + '"/></symbol>';
  }
  function feather() {
    let barbs = "";
    for (let y = 70; y <= 158; y += 4.5) {
      const w = 4 + (158 - y) * 0.17;
      barbs += '<path d="M30 ' + y + "q-" + (w * 0.5).toFixed(1) + " -5 -" + w.toFixed(1) + " -" + (6 + w * 0.25).toFixed(1) + "M30 " + y + "q" + (w * 0.5).toFixed(1) + " -5 " + w.toFixed(1) + " -" + (6 + w * 0.25).toFixed(1) + '"/>';
    }
    return '<symbol id="feather" viewBox="0 0 60 170">' +
      '<g fill="none" stroke="#5E9A4A" stroke-width=".9" opacity=".75">' + barbs + "</g>" +
      '<ellipse cx="30" cy="44" rx="27" ry="41" fill="#2E6F4E" opacity=".55"/>' +
      '<ellipse cx="30" cy="42" rx="18" ry="24" fill="#D9A62E"/>' +
      '<ellipse cx="30" cy="44" rx="14" ry="18.5" fill="#13806F"/>' +
      '<ellipse cx="30" cy="47" rx="8.5" ry="11.5" fill="#0B3C7A"/>' +
      '<ellipse cx="28" cy="43" rx="2.6" ry="3.6" fill="#7FC1E8" opacity=".75"/>' +
      '<path d="M30 168C31 130 30.5 95 30 62" stroke="#D9B45A" stroke-width="1.6" fill="none"/></symbol>';
  }
  const vel = '<symbol id="vel" viewBox="0 0 40 124">' +
    '<path d="M20 1C33 17 35 35 20 54C5 35 7 17 20 1Z" fill="url(#velg)" stroke="#8A5A12" stroke-width=".8"/>' +
    '<path d="M13.6 24h12.8M13.1 28.2h13.8M13.6 32.4h12.8" stroke="#FFF6E0" stroke-width="1.15" stroke-linecap="round"/>' +
    '<circle cx="20" cy="38.5" r="2.3" fill="#C8102E"/>' +
    '<rect x="14.5" y="53.5" width="11" height="3" rx="1.5" fill="url(#velg)"/>' +
    '<circle cx="20" cy="60.6" r="3.7" fill="url(#velg)" stroke="#8A5A12" stroke-width=".6"/>' +
    '<rect x="15.8" y="64" width="8.4" height="2.6" rx="1.3" fill="url(#velg)"/>' +
    '<rect x="18.3" y="66" width="3.4" height="54" rx="1.5" fill="url(#velg)"/>' +
    '<path d="M16.5 119.5h7l-1.6 4h-3.8z" fill="url(#velg)"/></symbol>';
  const symbols = '<svg width="0" height="0" style="position:absolute" aria-hidden="true">' +
    '<defs><linearGradient id="velg" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#F9DC8A"/><stop offset=".5" stop-color="#E8B54C"/><stop offset="1" stop-color="#B57E26"/></linearGradient></defs>' +
    flower("mg0", "#D8620B", "#EC7C10", "#F7992B", "#A9480A") +
    flower("mg1", "#E39A08", "#F6B516", "#FCCB45", "#B97A06") + vel + feather() + "</svg>";
  const velMark = (cls) => '<svg class="vel-mark' + (cls ? " " + cls : "") + '" viewBox="0 0 40 124" aria-hidden="true"><use href="#vel"/></svg>';

  // Hills with a hilltop temple and a rooster flag (Murugan's abodes are on hills)
  const hills = '<svg class="hills" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true">' +
    '<path d="M0 220V96C40 80 90 68 120 64C150 68 190 86 240 104C340 130 440 122 540 116C640 110 700 96 780 92C880 88 960 110 1060 120C1120 126 1170 130 1200 132V220Z" fill="#6A0F1D"/>' +
    '<g fill="#3E0710"><rect x="108" y="50" width="24" height="16"/><path d="M110 50h20l-4-20h-12z"/><rect x="115" y="26" width="10" height="4.5" rx="1"/>' +
    '<circle cx="120" cy="23" r="2.6"/><rect x="119.4" y="15" width="1.2" height="6"/></g>' +
    '<path d="M113 44h14M114.4 38h11.2" stroke="#6A0F1D" stroke-width="1.2"/>' +
    '<rect x="141" y="30" width="1.4" height="36" fill="#3E0710"/><path d="M142.4 30.5l11 4.2-11 4.3z" fill="#E8B54C"/>' +
    '<path d="M0 220V182C120 168 240 160 360 168C480 176 520 190 600 192C700 194 780 178 900 172C1020 166 1120 176 1200 184V220Z" fill="#4A0812"/>' +
    "</svg>";
  const feathers = '<svg class="feather l" viewBox="0 0 60 170" aria-hidden="true"><use href="#feather"/></svg>' +
    '<svg class="feather r" viewBox="0 0 60 170" aria-hidden="true"><use href="#feather"/></svg>';

  function renderStrands() {
    const box = $("#strands");
    if (!box) return;
    let n = Math.round(window.innerWidth / 46);
    n = Math.max(7, Math.min(27, n));
    if (n % 2 === 0) n++;
    if (box.dataset.n === String(n)) return;
    box.dataset.n = n;
    const mid = (n - 1) / 2;
    let out = "";
    for (let i = 0; i < n; i++) {
      const dist = Math.abs(i - mid) / mid;
      const k = Math.max(2, Math.round(2 + dist * 8) - (i % 2));
      const h = 15 * k + 30;
      let s = '<svg class="strand" style="--i:' + Math.round(Math.abs(i - mid)) + ";--dir:" + (i < mid ? -1 : 1) +
        '" width="22" height="' + h + '" viewBox="0 0 22 ' + h + '">' +
        '<line x1="11" y1="0" x2="11" y2="' + (h - 18) + '" stroke="#7A5512" stroke-width="1.2"/>';
      for (let j = 0; j < k; j++) s += '<use href="#mg' + ((i + j) % 2) + '" x="0" y="' + j * 15 + '" width="22" height="22"/>';
      const y = 15 * k + 6;
      s += '<circle cx="11" cy="' + (y + 1) + '" r="2.6" fill="#FFF6E0"/>' +
        '<path d="M11 ' + (y + 3) + "C15 " + (y + 8) + " 14.5 " + (y + 14) + " 11 " + (y + 17) + "C7.5 " + (y + 14) + " 7 " + (y + 8) + " 11 " + (y + 3) + 'Z" fill="#B3123B"/></svg>';
      out += s;
    }
    box.innerHTML = out;
  }

  /* ---------- Sections ---------- */
  function hero() {
    const photo = W.couplePhoto;
    return '<header class="hero' + (photo ? " has-couple" : "") + '" id="top">' + hills + feathers +
      '<div class="garland" aria-hidden="true"><div class="rope"></div><div class="strands" id="strands"></div></div>' +
      '<div class="hero-inner"><div class="hero-text">' + velMark() +
        (W.intro ? '<p class="hero-intro">' + esc(W.intro) + "</p>" : "") +
        '<h1 class="names" id="names" tabindex="-1"><span>' + esc(A.name) + '</span><span class="amp">&amp;</span><span>' + esc(B.name) + "</span></h1>" +
        '<p class="hero-date"><time datetime="' + main.toISOString() + '">' + longDate(main) + "</time>" +
          (events.length === 1 ? '<br><span class="time">' + clock(startOf(events[0])) + " to " + clock(endOf(events[0])) + "</span>" : "") +
          (W.city ? '<br><span class="city">' + esc(W.city) + "</span>" : "") + "</p>" +
        '<p class="countdown">' + countdown() + "</p></div>" +
        (photo ? '<figure class="hero-couple"><img src="' + esc(photo) + '" alt="' + esc(A.name + " and " + B.name) + '" width="640" height="1240" fetchpriority="high"></figure>' : "") +
      "</div></header>";
  }

  function invite() {
    const person = (p) => '<div class="partner">' +
      (p.title ? '<p class="role">' + esc(p.title) + "</p>" : "") +
      "<h3>" + esc(p.fullName || p.name) + "</h3>" +
      (p.qualification ? '<p class="qual">' + esc(p.qualification) + "</p>" : "") +
      (p.parents ? '<p class="parents">' + esc(p.parents) + (p.place ? '<br><span class="place">' + esc(p.place) + "</span>" : "") + "</p>" : "") + "</div>";
    return '<section class="section invite" aria-label="Invitation"><div class="wrap">' +
      (W.message ? '<p class="message">' + esc(W.message) + "</p>" : "") +
      '<div class="partners">' + person(A) + '<svg class="knot" viewBox="0 0 40 124" aria-hidden="true"><use href="#vel"/></svg>' + person(B) + "</div>" +
      "</div></section>";
  }

  function tamilInvite() {
    const T = W.tamil;
    if (!T || !T.text) return "";
    return '<section class="section tamil" lang="ta" aria-labelledby="ta-h"><div class="wrap">' +
      '<h2 id="ta-h">' + esc(T.heading || "திருமண அழைப்பிதழ்") + "</h2>" +
      '<p class="ta-text">' + esc(T.text) + "</p>" +
      (T.signature ? '<p class="ta-sign">' + esc(T.signatureLabel || "") + '<br><strong>' + esc(T.signature) + "</strong>" +
        (T.signaturePlace ? "<br>" + esc(T.signaturePlace) : "") + "</p>" : "") +
      "</div></section>";
  }

  function relatives() {
    const groups = (W.relatives || []).filter((g) => g && g.people && g.people.length);
    if (!groups.length) return "";
    return '<section class="section tamil" lang="ta" aria-labelledby="rel-h"><div class="wrap">' +
      '<h2 id="rel-h">' + esc(W.relativesHeading || "தங்கள் வரவை அன்புடன் எதிர்நோக்கும்") + "</h2>" +
      groups.map((g) => '<div class="rel-group">' + (g.label ? "<h4>" + esc(g.label) + "</h4>" : "") +
        "<ul>" + g.people.map((x) => "<li>" + esc(x) + "</li>").join("") + "</ul></div>").join("") +
      "</div></section>";
  }

  function story() {
    if (!W.story || !W.story.length) return "";
    return '<section class="section story" aria-labelledby="story-h"><div class="wrap"><h2 id="story-h">Our story</h2>' +
      W.story.map((p) => "<p>" + esc(p) + "</p>").join("") + "</div></section>";
  }

  function schedule() {
    if (!events.length) return "";
    return '<section class="section events" id="events" aria-labelledby="events-h"><div class="wrap">' +
      '<h2 id="events-h">Celebrations</h2><ol class="timeline">' +
      events.map((e, i) => {
        const s = startOf(e), v = venueOf(e);
        return '<li class="event">' +
          '<div class="event-date" aria-hidden="true">' +
            '<span class="wd">' + dtf({ weekday: "short" }).format(s) + "</span>" +
            '<span class="dd">' + dtf({ day: "numeric" }).format(s) + "</span>" +
            '<span class="mm">' + dtf({ month: "short" }).format(s) + "</span></div>" +
          '<div class="event-body">' +
            "<h3>" + esc(e.name) + "</h3>" +
            '<p class="event-time"><span class="sr-only">' + longDate(s) + ", </span>" + clock(s) + " to " + clock(endOf(e)) + "</p>" +
            '<p class="event-venue"><strong>' + esc(v.name) + "</strong>" + (v.address ? "<br><span>" + esc(v.address) + "</span>" : "") + "</p>" +
            (e.note ? '<p class="event-note">' + esc(e.note) + "</p>" : "") +
            '<div class="actions"><a class="btn btn-small" href="' + esc(mapsLink(v)) + '" target="_blank" rel="noopener">Directions</a></div>' +
            '<p class="cal"><span>Add to calendar</span>' +
              '<a href="' + esc(gcalLink(e)) + '" target="_blank" rel="noopener">Google</a>' +
              '<button type="button" data-ics="' + i + '">Apple / Outlook</button></p>' +
            "</div></li>";
      }).join("") + "</ol></div></section>";
  }

  function venue() {
    const v = W.venue;
    if (!v || !v.name) return "";
    return '<section class="section venue" id="venue" aria-labelledby="venue-h"><div class="wrap">' +
      '<h2 id="venue-h">Getting there</h2>' +
      '<p class="venue-name">' + esc(v.name) + "</p>" +
      (v.address ? '<p class="venue-addr">' + esc(v.address) + "</p>" : "") +
      '<iframe class="map" title="Map showing ' + esc(v.name) + '" src="' + esc(mapEmbed(v)) + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>' +
      '<a class="btn" href="' + esc(mapsLink(v)) + '" target="_blank" rel="noopener">Open in Google Maps</a>' +
      (v.notes ? '<p class="venue-notes">' + esc(v.notes) + "</p>" : "") +
      "</div></section>";
  }

  function gallery() {
    if (!W.photos || !W.photos.length) return "";
    return '<section class="section gallery" aria-labelledby="gallery-h"><div class="wrap wide"><h2 id="gallery-h">Moments</h2><div class="grid">' +
      W.photos.map((p) => {
        const src = typeof p === "string" ? p : p.src, alt = typeof p === "string" ? "Photo of " + pair : p.alt || "";
        return '<img src="' + esc(src) + '" alt="' + esc(alt) + '" loading="lazy">';
      }).join("") + "</div></div></section>";
  }

  const R = W.rsvp || {};
  const waNumber = String(R.whatsapp || "").replace(/\D/g, "");

  function rsvp() {
    if (!waNumber && !R.formUrl) return "";
    const deadline = R.deadline ? '<p class="lead">Please reply by ' + longDate(new Date(R.deadline + "T12:00:00Z")) + ".</p>" : "";
    let body;
    if (!waNumber && R.formUrl) {
      body = '<p style="text-align:center"><a class="btn btn-large" href="' + esc(R.formUrl) + '" target="_blank" rel="noopener">Open the RSVP form</a></p>';
    } else {
      const max = Math.max(1, Math.min(30, Number(R.maxGuests) || 10));
      body = '<form class="rsvp-form" id="rsvp-form" novalidate>' +
          '<div class="field"><label for="r-name">Your name</label><input type="text" id="r-name" name="name" autocomplete="name" value="' + esc(guest) + '"></div>' +
          '<fieldset class="field"><legend>Can you come?</legend>' +
            '<label class="choice"><input type="radio" name="attend" value="yes" checked> Yes, I\'ll be there</label>' +
            '<label class="choice"><input type="radio" name="attend" value="no"> Sorry, I can\'t make it</label></fieldset>' +
          '<div class="if-yes" id="if-yes">' +
            '<div class="field"><label for="r-guests">Number of guests, including you</label><select id="r-guests" name="guests">' +
              Array.from({ length: max }, (_, i) => "<option>" + (i + 1) + "</option>").join("") + "</select></div>" +
            (events.length > 1 ? '<fieldset class="field"><legend>Which events will you attend?</legend>' +
              events.map((e) => '<label class="choice"><input type="checkbox" name="events" value="' + esc(e.name) + '" checked> ' + esc(e.name) + "</label>").join("") +
              "</fieldset>" : "") +
          "</div>" +
          '<div class="field"><label for="r-msg">Message for the couple <span class="opt">(optional)</span></label><textarea id="r-msg" name="message" rows="3"></textarea></div>' +
          '<p class="form-error" id="r-err" role="alert"></p>' +
          '<button class="btn btn-large" type="submit">Send RSVP on WhatsApp</button>' +
          '<p class="hint">This opens WhatsApp with your reply ready to send.</p>' +
        "</form>";
    }
    return '<section class="section rsvp" id="rsvp" aria-labelledby="rsvp-h"><div class="wrap">' +
      '<h2 id="rsvp-h">Will you join us?</h2>' + deadline + body + "</div></section>";
  }

  function footer() {
    const people = (W.contacts || []).filter((c) => c && c.phone);
    return '<footer class="footer"><div class="rope" aria-hidden="true"></div>' + velMark() +
      (W.hashtag ? '<p class="hashtag">' + esc(W.hashtag) + "</p>"
                 : '<p class="footer-names">' + esc(A.name) + " <span>&amp;</span> " + esc(B.name) + "</p>") +
      (W.closing ? '<p class="closing">' + esc(W.closing) + "</p>" : "") +
      (people.length ? '<div class="contacts"><p>For anything you need, call</p><ul>' +
        people.map((c) => "<li>" + esc(c.name) + ': <a href="tel:' + esc(String(c.phone).replace(/[^\d+]/g, "")) + '">' + esc(c.phone) + "</a></li>").join("") +
        "</ul></div>" : "") +
      '<button type="button" class="btn btn-gold" id="share">Share this invitation</button>' +
      "</footer>";
  }

  function cover() {
    return '<div class="cover" id="cover" role="dialog" aria-modal="true" aria-labelledby="cover-names">' +
      '<div class="rope" aria-hidden="true"></div><div class="cover-inner">' +
      (W.deityPhoto ? '<figure class="deity"><img src="' + esc(W.deityPhoto) + '" alt="Lord Murugan" width="540" height="892" fetchpriority="high"></figure>' : velMark()) +
      (guest ? '<p class="cover-greet">Dear ' + esc(guest) + ',</p><p class="cover-line">you\'re invited to the wedding of</p>'
             : '<p class="cover-line">You\'re invited to the wedding of</p>') +
      '<p class="cover-names" id="cover-names">' + esc(A.name) + " <span>&amp;</span> " + esc(B.name) + "</p>" +
      '<p class="cover-date">' + longDate(main) + "</p>" +
      '<button type="button" class="btn btn-gold btn-large" id="open-invite">Open invitation</button>' +
      '</div><div class="rope" aria-hidden="true"></div></div>';
  }

  /* ---------- Music ---------- */
  let audio = null, musicBtn = null;
  function setupMusic() {
    if (!W.music) return;
    audio = new Audio(W.music);
    audio.loop = true;
    musicBtn = document.createElement("button");
    musicBtn.type = "button";
    musicBtn.className = "music";
    musicBtn.setAttribute("aria-pressed", "false");
    musicBtn.setAttribute("aria-label", "Music");
    musicBtn.innerHTML =
      '<svg class="off" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 18.5a3 3 0 1 1-2-2.83V5l12-2v12.5a3 3 0 1 1-2-2.83V7.4L9 8.73z"/></svg>' +
      '<svg class="on" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
    musicBtn.addEventListener("click", () => (audio.paused ? play() : pause()));
    document.body.appendChild(musicBtn);
  }
  function play() { if (!audio) return; audio.play().then(() => musicBtn.setAttribute("aria-pressed", "true")).catch(() => {}); }
  function pause() { if (!audio) return; audio.pause(); musicBtn.setAttribute("aria-pressed", "false"); }

  /* ---------- Build ---------- */
  document.body.insertAdjacentHTML("afterbegin", symbols);
  $("#app").innerHTML = hero() + invite() + tamilInvite() + story() + schedule() + venue() + relatives() + gallery() + rsvp() + footer();
  renderStrands();

  // Shrink the names in the first screen if a long name would not fit on one line
  function fitNames() {
    const h = $("#names");
    if (!h) return;
    h.style.fontSize = "";
    const room = h.parentElement.clientWidth;
    const widest = Math.max.apply(null, Array.from(h.children).map((el) => el.getBoundingClientRect().width));
    if (widest > room) h.style.fontSize = (parseFloat(getComputedStyle(h).fontSize) * room / widest * 0.97) + "px";
  }
  fitNames();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitNames);

  let resizeTimer;
  window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { renderStrands(); fitNames(); }, 150); });
  setupMusic();

  function reveal() {
    document.body.classList.add("is-open");
    setTimeout(() => document.body.classList.add("settled"), 3200);
  }

  if (W.showCover !== false) {
    document.body.insertAdjacentHTML("beforeend", cover());
    document.body.classList.add("locked");
    window.scrollTo(0, 0);
    const btn = $("#open-invite");
    btn.focus({ preventScroll: true });
    btn.addEventListener("click", () => {
      const c = $("#cover");
      c.classList.add("leaving");
      document.body.classList.remove("locked");
      reveal();
      const done = () => c.remove();
      c.addEventListener("transitionend", done, { once: true });
      setTimeout(done, 1300);
      $("#names").focus({ preventScroll: true });
      play();
    });
  } else {
    requestAnimationFrame(() => requestAnimationFrame(reveal));
  }

  /* ---------- Interactions ---------- */
  document.addEventListener("click", (ev) => {
    const ics = ev.target.closest("[data-ics]");
    if (ics) downloadIcs(Number(ics.dataset.ics));
  });

  $("#share").addEventListener("click", async () => {
    const text = "You're invited to " + pair + "'s wedding on " + longDate(main) + ".";
    if (navigator.share) {
      try { await navigator.share({ title: document.title, text: text, url: pageUrl() }); } catch (e) {}
      return;
    }
    window.open("https://wa.me/?text=" + encodeURIComponent(text + " " + pageUrl()), "_blank", "noopener");
  });

  const form = $("#rsvp-form");
  if (form) {
    const err = $("#r-err"), ifYes = $("#if-yes");
    form.addEventListener("change", () => { ifYes.hidden = form.elements.attend.value !== "yes"; });
    form.addEventListener("submit", (ev) => {
      ev.preventDefault();
      const fd = new FormData(form);
      const name = String(fd.get("name") || "").trim();
      if (!name) { err.textContent = "Enter your name so the family knows who's replying."; $("#r-name").focus(); return; }
      if (!waNumber) { err.textContent = "RSVP isn't switched on yet: the WhatsApp number is missing from the wedding details."; return; }
      const yes = fd.get("attend") === "yes";
      const lines = ["RSVP for " + pair + "'s wedding", "Name: " + name, "Attending: " + (yes ? "Yes" : "No")];
      if (yes) {
        lines.push("Guests: " + fd.get("guests"));
        const chosen = fd.getAll("events");
        if (events.length > 1) lines.push("Events: " + (chosen.length ? chosen.join(", ") : "None selected"));
      }
      const note = String(fd.get("message") || "").trim();
      if (note) lines.push("Message: " + note);
      err.textContent = "";
      const a = document.createElement("a");
      a.href = "https://wa.me/" + waNumber + "?text=" + encodeURIComponent(lines.join("\n"));
      a.target = "_blank"; a.rel = "noopener";
      document.body.appendChild(a); a.click(); a.remove();
    });
  }
})();
</script>
</body>
</html>
